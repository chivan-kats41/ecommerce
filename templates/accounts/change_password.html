{% extends 'base.html' %}

{% block content %}

<section style="padding-top: 40px; padding-bottom: 40px; background-color: #f8f9fa;">

  {% include 'includes/alerts.html' %}

  <div style="max-width: 1140px; margin: 0 auto; padding: 0 15px;">
    <div style="display: flex; flex-wrap: wrap; margin: 0 -15px;">

      {% include 'includes/dashboard_sidebar.html' %}

      <main style="flex: 0 0 75%; max-width: 75%; padding: 0 15px; box-sizing: border-box;">
        <article style="border: 1px solid #dee2e6; border-radius: 6px; background: #fff;">

          <header style="padding: 12px 16px; background-color: #f7f7f7; border-bottom: 1px solid #dee2e6; border-radius: 6px 6px 0 0;">
            <strong style="display: inline-block; margin-right: 12px;">Change Your Password</strong>
          </header>

          <div style="padding: 16px;">
            <div style="display: flex; flex-wrap: wrap;">
              <div style="width: 100%; box-sizing: border-box;">

                <form action="{% url 'change_password' %}" method="POST">
                  {% csrf_token %}

                  <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 0.9rem;">Current Password</label>
                    <input type="password" name="current_password" placeholder="Current Password" required
                      style="width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 1rem; box-sizing: border-box; outline: none;">
                  </div>

                  <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 0.9rem;">Create new password</label>
                    <input type="password" name="new_password" placeholder="Create New Password" required
                      style="width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 1rem; box-sizing: border-box; outline: none;">
                  </div>

                  <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 0.9rem;">Confirm new password</label>
                    <input type="password" name="confirm_password" placeholder="Confirm New Password" required
                      style="width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 1rem; box-sizing: border-box; outline: none;">
                  </div>

                  <input type="submit" value="Submit"
                    style="padding: 10px 24px; background-color: #0d6efd; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer;">

                </form>
              </div>
            </div>
          </div>

        </article>
      </main>

    </div>
  </div>

</section>

{% endblock %}
