{% extends 'base.html' %}

{% block content %}

<section style="min-height: 84vh; padding-top: 40px; padding-bottom: 40px;">

  <div style="max-width: 380px; margin: 100px auto 0; border: 1px solid #dee2e6; border-radius: 6px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.07);">
    <div style="padding: 24px 32px;">

      <h4 style="margin: 0 0 20px; font-size: 1.25rem; font-weight: 600;">Reset Password</h4>

      {% include 'includes/alerts.html' %}

      <form action="{% url 'resetPassword' %}" method="POST">
        {% csrf_token %}

        <div style="margin-bottom: 16px;">
          <input type="password" style="width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 1rem; box-sizing: border-box; outline: none;" placeholder="Create Password" name="password">
        </div>

        <div style="margin-bottom: 16px;">
          <input type="password" style="width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 1rem; box-sizing: border-box; outline: none;" placeholder="Confirm Password" name="confirm_password">
        </div>

        <div style="margin-bottom: 8px;">
          <button type="submit" style="width: 100%; padding: 10px; background-color: #0d6efd; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer;">
            Reset
          </button>
        </div>

      </form>
    </div>
  </div>

  <p style="text-align: center; margin-top: 16px;">Don't have account? <a href="{% url 'register' %}" style="color: #0d6efd; text-decoration: none;">Sign up</a></p>
  <br><br>

</section>

{% endblock %}
