{% extends 'base.html' %}
{% block content %}

<style>
  .dashboard-wrapper {
    display: flex;
    flex-wrap: wrap;
    margin: 0 -15px;
  }

  .dashboard-main {
    flex: 0 0 75%;
    max-width: 75%;
    padding: 0 15px;
    box-sizing: border-box;
  }

  .dashboard-cards {
    display: flex;
    flex-wrap: wrap;
    margin: 0 -15px;
  }

  .dashboard-card {
    flex: 0 0 50%;
    max-width: 50%;
    padding: 0 15px;
    box-sizing: border-box;
    margin-bottom: 16px;
  }

  @media (max-width: 768px) {
    .dashboard-main {
      flex: 0 0 100%;
      max-width: 100%;
    }

    .dashboard-card {
      flex: 0 0 100%;
      max-width: 100%;
    }
  }
</style>

<section style="padding-top: 40px; padding-bottom: 40px; background-color: #f8f9fa;">
  {% include 'includes/alerts.html' %}
  <div style="max-width: 1140px; margin: 0 auto; padding: 0 15px;">
    <div class="dashboard-wrapper">
      {% include 'includes/dashboard_sidebar.html' %}
      <main class="dashboard-main">
        <article style="border: 1px solid #dee2e6; border-radius: 6px; background: #fff;">
          <header style="padding: 12px 16px; background-color: #f7f7f7; border-bottom: 1px solid #dee2e6; border-radius: 6px 6px 0 0;">
            <strong style="display: inline-block; margin-right: 12px;">Logged in as:</strong>
            <span>{{user.full_name}}</span>
          </header>
          <div style="padding: 16px;">
            <div class="dashboard-cards">
              <!-- Total Orders -->
              <div class="dashboard-card">
                <div style="border: 1px solid #dee2e6; border-radius: 6px; background: #fff; text-align: center;">
                  <div style="padding: 16px;">
                    <h5 style="margin: 0 0 8px; font-size: 1rem; font-weight: 600;">Total Orders</h5>
                    <h4 style="margin: 0 0 8px; font-size: 1.5rem;">{{orders_count}}</h4>
                    <a href="{% url 'my_orders' %}" style="color: #0d6efd; text-decoration: none;">View Orders</a>
                  </div>
                </div>
              </div>
              <!-- Profile -->
              <div class="dashboard-card">
                <div style="border: 1px solid #dee2e6; border-radius: 6px; background: #fff; text-align: center;">
                  <div style="padding: 16px;">
                    <img src="{{userprofile.profile_picture.url}}" alt="User Profile Picture" width="50" height="50" style="border-radius: 50%; margin-bottom: 8px;">
                    <p style="margin-bottom: 0;">{{user.email}}</p>
                    <p style="margin: 4px 0 0;">{{user.phone_number}}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </article>
      </main>
    </div>
  </div>
</section>

{% endblock %}
