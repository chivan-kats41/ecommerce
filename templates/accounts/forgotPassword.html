{% extends 'base.html' %}


{% block content %}

<section style="min-height:84vh; padding-top: 40px; padding-bottom: 40px;">

<!-- ============================ COMPONENT LOGIN   ================================= -->

	<div style="max-width: 600px; margin-top:100px; margin-left: auto; margin-right: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); background-color: #fff;">

      <div style="padding: 30px 40px;">
      <h4 style="margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 600;">Forgot Password</h4>
      {% include 'includes/alerts.html' %}
      <form action="{% url 'forgotPassword' %}" method="POST">
        {% csrf_token %}
          <div style="margin-bottom: 1rem;">
			 <input type="email" style="display: block; width: 100%; padding: 10px 15px; font-size: 1rem; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; outline: none;" placeholder="Email Address" name="email">
          </div>

          <div style="margin-bottom: 1rem;">
          	<a href="{% url 'login' %}" style="float: right; color: #007bff; text-decoration: none;">Got password? Login</a>

          </div>
          <div style="margin-bottom: 1rem; overflow: hidden;">
              <button type="submit" style="display: block; width: 100%; padding: 10px 15px; background-color: #007bff; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer;"> Submit  </button>
          </div>
      </form>
      </div>
    </div>

     <p style="text-align: center; margin-top: 1.5rem;">Don't have account? <a href="{% url 'register' %}" style="color: #007bff; text-decoration: none;">Sign up</a></p>
     <br><br>
<!-- ============================ COMPONENT LOGIN  END.// ================================= -->

</section>
{% endblock %}
