{% extends 'base.html' %}
{% load static %}
{% block content %}

<style>
  .home-banner img {
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
  }

  .product-grid {
    display: flex;
    flex-wrap: wrap;
    margin: 0 -15px;
  }

  .product-col {
    width: 25%;
    padding: 0 15px;
    box-sizing: border-box;
    margin-bottom: 20px;
  }

  @media (max-width: 992px) {
    .product-col { width: 33.33%; }
  }

  @media (max-width: 768px) {
    .product-col { width: 50%; }
  }

  @media (max-width: 480px) {
    .product-col { width: 100%; }
  }
</style>

<!-- ========================= SECTION MAIN ========================= -->
<section style="padding-top: 16px; padding-bottom: 16px;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 15px;">
    <div class="home-banner">
      <img src="{% static 'images/banners/cover.jpg' %}">
    </div>
  </div>
</section>
<!-- ========================= SECTION MAIN END// ========================= -->

<!-- ========================= SECTION ========================= -->
<section style="padding-top: 16px; padding-bottom: 16px;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 15px;">
    <header style="margin-bottom: 20px; overflow: hidden;">
      <a href="{% url 'store' %}" style="float: right; padding: 6px 16px; border: 1px solid #007bff; color: #007bff; border-radius: 4px; text-decoration: none; font-size: 14px;">See all</a>
      <h3 style="font-size: 20px; font-weight: 600; margin: 0; padding-top: 6px;">Popular products</h3>
    </header>
    <div class="product-grid">
      {% for product in products %}
      <div class="product-col">
        <div style="border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; background: #fff; height: 100%;">
          <a href="{{ product.get_url }}" style="display: block; overflow: hidden; height: 180px; background: #f5f5f5;">
            <img src="{{ product.images.url }}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          </a>
          <figcaption style="padding: 12px;">
            <a href="{{ product.get_url }}" style="display: block; font-size: 14px; color: #333; text-decoration: none; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ product.product_name }}</a>
            <div style="font-size: 16px; font-weight: 700; color: #007bff; margin-top: 4px;">$ {{ product.price }}</div>
            <div style="margin-top: 6px; color: #f0ad4e; font-size: 13px;">
              <span>
                <i class="fa fa-star{% if product.averageReview < 0.5 %}-o{% elif product.averageReview >= 0.5 and product.averageReview < 1 %}-half-o {% endif %}" aria-hidden="true"></i>
                <i class="fa fa-star{% if product.averageReview < 1.5 %}-o{% elif product.averageReview >= 1.5 and product.averageReview < 2 %}-half-o {% endif %}" aria-hidden="true"></i>
                <i class="fa fa-star{% if product.averageReview < 2.5 %}-o{% elif product.averageReview >= 2.5 and product.averageReview < 3 %}-half-o {% endif %}" aria-hidden="true"></i>
                <i class="fa fa-star{% if product.averageReview < 3.5 %}-o{% elif product.averageReview >= 3.5 and product.averageReview < 4 %}-half-o {% endif %}" aria-hidden="true"></i>
                <i class="fa fa-star{% if product.averageReview < 4.5 %}-o{% elif product.averageReview >= 4.5 and product.averageReview < 5 %}-half-o {% endif %}" aria-hidden="true"></i>
              </span>
            </div>
          </figcaption>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- ========================= SECTION END// ========================= -->

{% endblock %}
